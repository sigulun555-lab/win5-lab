name: B2 numerical equivalence

on:
  pull_request:
    paths:
      - "research/factor-validation/fit_b2_candidates.py"
      - "research/factor-validation/tests/**"
      - ".github/workflows/b2-equivalence.yml"
  workflow_dispatch:

jobs:
  cache-equivalence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: python -m pip install numpy scipy
      - name: Verify cached objective and gradient
        run: python -m unittest discover -s research/factor-validation/tests -v
