name: test-b2-leakage

on:
  push:
    paths:
      - "research/factor-validation/b2_features.py"
      - "research/factor-validation/b2_dataset_prep.py"
      - "research/factor-validation/b2_class_lookup.py"
      - "research/factor-validation/fit_b2_candidates.py"
      - "research/factor-validation/test_b2_leakage.py"
      - "research/factor-validation/compare_b2_race_datasets.py"
      - "research/factor-validation/build_b2_venue_aliases.py"
      - "scripts/audit_race_dataset.py"
      - "scripts/audit_b2_horse_pages.py"
      - ".github/workflows/rebuild-b2-historical-data.yml"
      - ".github/workflows/test-b2-leakage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  leakage-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fitting dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Run B2 leakage safeguards
        run: python -m unittest discover -s research/factor-validation -p 'test_b2_leakage.py' -v
