name: win5-morning-snapshot

on:
  workflow_dispatch:
  schedule:
    # 土・日曜の日本時間08:00
    - cron: "0 23 * * 5,6"

permissions:
  contents: write

concurrency:
  group: win5-morning-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          path: main

      - name: データ用ブランチを取得
        run: |
          set -e
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git clone --depth 1 --branch odds-data "$REMOTE" data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: WIN5対象レースを含むオッズを取得
        run: |
          python main/collector/jra_odds_snapshot.py \
            --window-min 600 \
            --out data/odds

      - name: 変更があれば保存
        run: |
          cd data
          git config user.name "win5-morning-snapshot"
          git config user.email "win5-morning-snapshot@users.noreply.github.com"
          git add odds/
          if git diff --cached --quiet; then
            echo "新しいオッズはありません"
            exit 0
          fi
          git commit -m "WIN5 morning odds snapshot"
          git push origin odds-data