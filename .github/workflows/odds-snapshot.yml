name: odds-snapshot

# 競馬開催日に、単勝オッズ（JRA公式の出馬表）を10分ごとに保存する。保存先は main ではなく、別ブランチ odds-data（追記のみ）。
#   odds/<日付>.jsonl       ：これから発走するレースを1レース1行（通常の収集）
#   odds/win5/<日付>.jsonl  ：JRA公式の対象5レースを照合できたときだけ、5レース1組（WIN5）
#   odds/logs/<日付>.jsonl  ：取得元・取得時刻・対象レース一覧・照合結果・保存結果のログ
# 照合できなかった（欠落・余分・重複・順番違い）ときは、収集の手順が失敗（赤）になり、理由がログに残る。
on:
  push:
    branches: [main]
    paths:
      - "collector/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/odds-snapshot.yml"
  pull_request:
    branches: [main]
    paths:
      - "collector/**"
      - "tests/**"
      - ".github/workflows/odds-snapshot.yml"
  schedule:
    # JST 08:00〜16:59 の土・日・月（祝日の月曜に備える）。UTC表記。
    - cron: "*/10 23 * * 5,6,0"
    - cron: "*/10 0-7 * * 6,0,1"
  workflow_dispatch:
    inputs:
      window_min:
        description: "今から何分以内に発走するレースを取るか"
        default: "75"

permissions:
  contents: write

concurrency:
  group: odds-data-writer
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - name: データ用ブランチ(odds-data)を用意
        run: |
          set -e
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$REMOTE" odds-data >/dev/null 2>&1; then
            git clone --depth 1 --branch odds-data "$REMOTE" data
          else
            mkdir data && cd data && git init -q -b odds-data && git remote add origin "$REMOTE"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: テスト（収集コード）
        run: python -m unittest discover -s main/tests -p "test_*.py"
      - name: オッズを保存（通常の収集 + WIN5の照合）
        run: python main/collector/jra_odds_snapshot.py --scope both --out data/odds --window-min "${{ github.event.inputs.window_min || '75' }}"
      - name: 変更があればコミットして追記
        if: always()
        run: |
          cd data
          git config user.name "odds-snapshot"
          git config user.email "odds-snapshot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "新しいオッズはありません。"; exit 0; fi
          git commit -q -m "odds snapshot $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
          for i in 1 2 3; do git push origin odds-data && break || { git pull --rebase origin odds-data; sleep 3; }; done
