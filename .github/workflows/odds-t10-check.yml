name: odds-t10-check (branch-only, read-only)

# 新しい収集コードの確認用。このブランチへの push でだけ動く。odds-data へは書かない。
#  1) 実ページ（JRA公式）で、明日以降の開催日のレース一覧と取得予定を確認する（--list-only）
#  2) 開催のない日を指定して、成功扱いにならない（終了コード1）ことを確認する
on:
  push:
    branches: [claude/odds-t10-capture]
    paths:
      - "collector/odds_t10.py"
      - "tests/test_odds_t10.py"
      - ".github/workflows/odds-t10-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -q
      - name: 実ページでレース一覧と取得予定（取得も保存もしない）
        run: |
          for d in 2026-10-31 2026-11-01; do
            echo "== $d"; python collector/odds_t10.py --session all --date $d --list-only || echo "(exit $?)"
          done
      - name: 開催のない日は成功扱いにならない
        run: |
          set +e
          python collector/odds_t10.py --session all --date 2026-10-30 --dry-run --out /tmp/t10-neg
          code=$?
          echo "exit code: $code"
          test "$code" = "1"
          ls /tmp/t10-neg/odds_t10/selected 2>/dev/null && echo "selected files exist (unexpected)" && exit 1 || true
      - name: 既存の収集コードとワークフローが変わっていないこと
        run: |
          git fetch origin main --depth=1
          git diff --stat origin/main -- collector/jra_odds_snapshot.py .github/workflows/odds-snapshot.yml tests/test_collector.py
          test -z "$(git diff origin/main -- collector/jra_odds_snapshot.py .github/workflows/odds-snapshot.yml)"
