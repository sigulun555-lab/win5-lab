name: collector-tests

on:
  push:
    paths:
      - "collector/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/collector-tests.yml"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - name: Audit available B2 horse-history bundle
        run: python scripts/audit_b2_history_bundle.py data/horse_history/2026-10-25.json
