name: B2 real-data cache benchmark

on:
  push:
    branches:
      - optimize-b2-cache-progress
    paths:
      - "research/factor-validation/benchmark_b2_cache.py"
      - ".github/workflows/b2-cache-benchmark.yml"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful historical data run ID"
        required: true
        default: "40882658354"

permissions:
  contents: read
  actions: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimize-b2-cache-progress
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Download pinned prepared dataset artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts"
          artifact_id="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${api}" | python -c 'import json,sys; d=json.load(sys.stdin); xs=[x for x in d.get("artifacts",[]) if x.get("name")=="b2-historical-data-audit" and not x.get("expired")]; print(max(xs,key=lambda x:x["created_at"])["id"] if xs else "")')"
          test -n "${artifact_id}" || { echo "No unexpired b2-historical-data-audit artifact for source run ${SOURCE_RUN_ID}"; exit 1; }
          curl -fL --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" -o /tmp/b2-artifact.zip
          unzip -l /tmp/b2-artifact.zip | grep 'reports/b2-prepared-races.json'
          unzip -oq /tmp/b2-artifact.zip 'reports/b2-prepared-races.json'
          test -s reports/b2-prepared-races.json
          sha256sum reports/b2-prepared-races.json
      - name: Compare uncached and cached full-grid tuning on real data
        run: python research/factor-validation/benchmark_b2_cache.py reports/b2-prepared-races.json --out reports/b2-cache-benchmark.json
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b2-cache-benchmark
          path: reports/b2-cache-benchmark.json
          if-no-files-found: warn
          retention-days: 14
