name: GPT WIN5 2026-11-07 history-only forecast
on:
  push:
    branches:
      - gpt-win5-2026-11-07-run
    paths:
      - ".github/workflows/gpt-win5-2026-11-07.yml"
      - "collector/compute_gpt_win5_history_only.py"
permissions:
  contents: write
concurrency:
  group: gpt-win5-2026-11-07
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt-win5-2026-11-07-run
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect JRA official horse histories
        run: python collector/horse_history.py --date 2026-11-07 --out data/horse_history --workers 4
      - name: Compute independent GPT probabilities and marks
        run: python collector/compute_gpt_win5_history_only.py
      - name: Commit immutable forecast outputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "gpt-win5-forecast"
          git config user.email "gpt-win5-forecast@users.noreply.github.com"
          git add data/horse_history/2026-11-07.json data/win5_joint/2026-11-07/
          git commit -m "Add GPT independent WIN5 forecast 2026-11-07"
          git push origin HEAD:gpt-win5-2026-11-07-run
