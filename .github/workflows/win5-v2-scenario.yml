name: win5-v2-scenario

on:
  push:
    branches: [main]
    paths:
      - "data/win5_joint/**/win5_gpt_v2_scenario.csv"
      - "scripts/build_gpt_v2_scenario.py"
      - "tests/test_build_gpt_v2_scenario.py"
      - ".github/workflows/win5-v2-scenario.yml"
  workflow_dispatch:
    inputs:
      date:
        description: "開催日（YYYY-MM-DD）。手動実行時に指定"
        required: true
        default: "2026-10-24"
      alpha:
        description: "市場オッズ変動の反映強度（0=V1維持、1=全面反映）"
        required: true
        default: "1.0"

permissions:
  contents: write

concurrency:
  group: win5-v2-scenario-writer
  cancel-in-progress: false

jobs:
  build-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 開催日を特定
        id: target
        env:
          INPUT_DATE: ${{ inputs.date }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RUN_DATE="$INPUT_DATE"
          else
            RUN_DATE="$(git diff --name-only HEAD^ HEAD | sed -n 's#^data/win5_joint/\([0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]\)/win5_gpt_v2_scenario\.csv$#\1#p' | head -n 1)"
            if [ -z "$RUN_DATE" ]; then
              RUN_DATE="$(find data/win5_joint -mindepth 2 -maxdepth 2 -name win5_gpt_v2_scenario.csv -printf '%h\n' | sed 's#^data/win5_joint/##' | sort -r | head -n 1)"
            fi
          fi
          [[ "$RUN_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          echo "date=$RUN_DATE" >> "$GITHUB_OUTPUT"
      - name: 開催日別入力ファイルを検証
        env:
          RUN_DATE: ${{ steps.target.outputs.date }}
        run: test -f "data/win5_joint/$RUN_DATE/win5_gpt_v2_scenario.csv"
      - name: V2計算テスト
        run: python -m unittest tests/test_build_gpt_v2_scenario.py
      - name: 開催日別V2シナリオを再生成
        env:
          RUN_DATE: ${{ steps.target.outputs.date }}
          ALPHA: ${{ inputs.alpha || '1.0' }}
        run: |
          python scripts/build_gpt_v2_scenario.py \
            --input "data/win5_joint/$RUN_DATE/win5_gpt_v2_scenario.csv" \
            --output "data/win5_joint/$RUN_DATE/win5_gpt_v2_scenario.csv" \
            --alpha "$ALPHA"
      - name: 変更があれば開催日別CSVを保存
        env:
          RUN_DATE: ${{ steps.target.outputs.date }}
        run: |
          git config user.name "win5-v2-scenario"
          git config user.email "win5-v2-scenario@users.noreply.github.com"
          git add "data/win5_joint/$RUN_DATE/win5_gpt_v2_scenario.csv"
          if git diff --cached --quiet; then
            echo "V2 CSVに変更はありません。"
            exit 0
          fi
          git commit -m "Regenerate WIN5 V2 scenario for $RUN_DATE"
          git push origin main
