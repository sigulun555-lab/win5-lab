name: win5-v2-scenario

on:
  push:
    branches: [main]
    paths:
      - "win5_gpt_primary.csv"
      - "scripts/build_gpt_v2_scenario.py"
      - "tests/test_build_gpt_v2_scenario.py"
      - ".github/workflows/win5-v2-scenario.yml"
  workflow_dispatch:
    inputs:
      alpha:
        description: "市場オッズ変動の反映強度（0=V1維持、1=全面反映）"
        required: true
        default: "1.0"

permissions:
  contents: write

concurrency:
  group: win5-v2-scenario-writer
  cancel-in-progress: false

jobs:
  build-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: V2計算テスト
        run: python -m unittest tests/test_build_gpt_v2_scenario.py
      - name: V2シナリオを再生成
        run: python scripts/build_gpt_v2_scenario.py --input win5_gpt_primary.csv --output win5_gpt_v2_scenario.csv --alpha "${{ github.event.inputs.alpha || '1.0' }}"
      - name: V2 CSVをコミット
        run: |
          git config user.name "win5-v2-scenario"
          git config user.email "win5-v2-scenario@users.noreply.github.com"
          git add win5_gpt_v2_scenario.csv
          if git diff --cached --quiet; then
            echo "V2 CSVに変更はありません。"
            exit 0
          fi
          git commit -m "Regenerate WIN5 V2 market-adjusted scenario"
          git push origin main
