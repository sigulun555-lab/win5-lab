name: win5-result-evaluation

on:
  workflow_dispatch:
    inputs:
      date:
        description: "結果と予想CSVが入っている開催日（YYYY-MM-DD）"
        required: true
        default: "2026-10-24"

permissions:
  contents: write

concurrency:
  group: win5-result-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 入力ファイルを確認
        env:
          RUN_DATE: ${{ inputs.date }}
        run: |
          set -e
          [[ "$RUN_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          test -f "data/win5_joint/$RUN_DATE/win5_gpt_v2_scenario.csv"
          test -f "data/win5_joint/$RUN_DATE/win5_result.csv"
      - name: 全テスト
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: 結果を評価
        env:
          RUN_DATE: ${{ inputs.date }}
        run: |
          python scripts/evaluate_win5_predictions.py \
            --predictions "data/win5_joint/$RUN_DATE/win5_gpt_v2_scenario.csv" \
            --results "data/win5_joint/$RUN_DATE/win5_result.csv" \
            --output "reports/win5-result-evaluation-$RUN_DATE.md"
      - name: レポートを保存
        run: |
          git config user.name "win5-result-evaluation"
          git config user.email "win5-result-evaluation@users.noreply.github.com"
          git add "reports/win5-result-evaluation-*.md"
          if git diff --cached --quiet; then
            echo "評価レポートに変更はありません"
            exit 0
          fi
          git commit -m "Evaluate WIN5 predictions for ${{ inputs.date }}"
          git push origin main
