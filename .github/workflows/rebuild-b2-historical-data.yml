name: rebuild-b2-historical-data

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild-b2-historical-data
  cancel-in-progress: false

jobs:
  collect-parse-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare collector output directory
        run: mkdir -p research/factor-validation/ses reports
      - name: Collect JRA result pages
        working-directory: research/factor-validation
        run: python crawl.py
      - name: Parse collected pages
        working-directory: research/factor-validation
        run: python parse_ses.py
      - name: Audit race dataset integrity
        run: python scripts/audit_race_dataset.py research/factor-validation/races.json --out reports/b2-race-dataset-audit.json
      - name: Reconcile current races against pinned reference dataset
        run: python research/factor-validation/compare_b2_race_datasets.py --current research/factor-validation/races.json --reference research/factor-validation/data/races.json.gz --out reports/b2-race-dataset-reconciliation.json
      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Retrieve pinned horse-pages snapshot from b2-data
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin b2-data
          MANIFEST_PATH=$(git ls-tree -r --name-only FETCH_HEAD -- horse-pages/ | grep -E '^horse-pages/manifest-[0-9]{8}T[0-9]{6}Z\.json
      - name: Save dataset and audit as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b2-historical-data-audit
          path: |
            research/factor-validation/races.json
            research/factor-validation/months.json
            research/factor-validation/crawl_status.json
            research/factor-validation/ses/
            reports/b2-race-dataset-audit.json
            reports/b2-race-dataset-reconciliation.json
            reports/b2-prepared-races.json
            reports/b2-preliminary-eval.json
            reports/b2-candidate-validation.json
            reports/b2-horse-pages-manifest.json
            reports/b2-horse-pages-audit.json
            reports/b2-horse-pages.json.gz
            reports/b2-horse-pages.json
            research/factor-validation/b2_venue_aliases.json
            research/factor-validation/b2_venue_aliases.sha256
          if-no-files-found: warn
          retention-days: 14
 | sort | tail -n 1)
          test -n "$MANIFEST_PATH" || { echo "No horse-pages manifest found on b2-data"; exit 1; }
          STAMP="${MANIFEST_PATH#horse-pages/manifest-}"
          STAMP="${STAMP%.json}"
          HORSE_PATH="horse-pages/horses-$STAMP.json.gz"
          git show "FETCH_HEAD:$MANIFEST_PATH" > reports/b2-horse-pages-manifest.json
          git show "FETCH_HEAD:$HORSE_PATH" > reports/b2-horse-pages.json.gz
          gzip -dc reports/b2-horse-pages.json.gz > reports/b2-horse-pages.json
          echo "manifest=$MANIFEST_PATH"
          echo "horse_pages=$HORSE_PATH"
          sha256sum reports/b2-horse-pages-manifest.json reports/b2-horse-pages.json.gz reports/b2-horse-pages.json
      - name: Audit pinned horse-pages snapshot and manifest
        run: python scripts/audit_b2_horse_pages.py --gzip reports/b2-horse-pages.json.gz --manifest reports/b2-horse-pages-manifest.json --out reports/b2-horse-pages-audit.json
      - name: Build and hash venue aliases from race results and all horse histories
        run: python research/factor-validation/build_b2_venue_aliases.py research/factor-validation/races.json --horse-history reports/b2-horse-pages.json --out research/factor-validation/b2_venue_aliases.json
      - name: Test B2 leakage and fitting safeguards
        run: python -m unittest discover -s research/factor-validation -p 'test_b2_leakage.py' -v
      - name: Prepare leakage-safe B2 dataset
        run: python research/factor-validation/b2_dataset_prep.py research/factor-validation/races.json --aliases research/factor-validation/b2_venue_aliases.json --horse-history reports/b2-horse-pages.json --out reports/b2-prepared-races.json
      - name: Fit preregistered B2 candidates and produce predictions
        run: python research/factor-validation/fit_b2_candidates.py reports/b2-prepared-races.json --out reports/b2-candidate-validation.json --history-manifest reports/b2-horse-pages-manifest.json --race-reconciliation reports/b2-race-dataset-reconciliation.json
      - name: Save dataset and audit as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b2-historical-data-audit
          path: |
            research/factor-validation/races.json
            research/factor-validation/months.json
            research/factor-validation/crawl_status.json
            research/factor-validation/ses/
            reports/b2-race-dataset-audit.json
            reports/b2-race-dataset-reconciliation.json
            reports/b2-prepared-races.json
            reports/b2-preliminary-eval.json
          if-no-files-found: warn
          retention-days: 14
