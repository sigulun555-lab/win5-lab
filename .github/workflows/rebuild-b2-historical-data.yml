name: rebuild-b2-historical-data

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild-b2-historical-data
  cancel-in-progress: false

jobs:
  collect-parse-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare collector output directory
        run: mkdir -p research/factor-validation/ses reports
      - name: Collect JRA result pages
        working-directory: research/factor-validation
        run: python crawl.py
      - name: Parse collected pages
        working-directory: research/factor-validation
        run: python parse_ses.py
      - name: Audit race dataset integrity
        run: python scripts/audit_race_dataset.py research/factor-validation/races.json --out reports/b2-race-dataset-audit.json
      - name: Reconcile current races against pinned reference dataset
        run: python research/factor-validation/compare_b2_race_datasets.py --current research/factor-validation/races.json --reference research/factor-validation/data/races.json.gz --out reports/b2-race-dataset-reconciliation.json
      - name: Prepare leakage-safe B2 dataset
        run: python research/factor-validation/b2_dataset_prep.py research/factor-validation/races.json --aliases research/factor-validation/b2_venue_aliases.json --horse-history data/horse_history/2026-10-25.json --out reports/b2-prepared-races.json
      - name: Install evaluation dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Run preliminary chronological benchmark (diagnostic only)
        run: python research/factor-validation/b2_preliminary_eval.py reports/b2-prepared-races.json --out reports/b2-preliminary-eval.json
      - name: Save dataset and audit as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b2-historical-data-audit
          path: |
            research/factor-validation/races.json
            research/factor-validation/months.json
            research/factor-validation/crawl_status.json
            research/factor-validation/ses/
            reports/b2-race-dataset-audit.json
            reports/b2-race-dataset-reconciliation.json
            reports/b2-prepared-races.json
            reports/b2-preliminary-eval.json
          if-no-files-found: warn
          retention-days: 14
