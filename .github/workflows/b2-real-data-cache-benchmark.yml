name: B2 full historical cache comparison (manual)

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful historical data run ID containing the pinned audit artifact"
        required: true
        default: "40882658354"

permissions:
  actions: read
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.5.4 scipy==1.18.1
      - name: Download pinned historical dataset
        uses: actions/download-artifact@v4
        with:
          name: b2-historical-data-audit
          repository: sigulun555-lab/win5-lab
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: baseline-artifact
      - name: Prepare identical input and same-run baseline implementation
        run: |
          set -euo pipefail
          mkdir -p reports
          cp baseline-artifact/reports/b2-prepared-races.json reports/
          cp baseline-artifact/reports/b2-horse-pages-manifest.json reports/
          cp baseline-artifact/reports/b2-horse-pages-audit.json reports/
          cp baseline-artifact/reports/b2-race-dataset-reconciliation.json reports/
          git show 20cf061a0e0ae9331b59a413b553bea1558361e0:research/factor-validation/fit_b2_candidates.py > reports/fit_b2_candidates_uncached.py
          sha256sum reports/b2-prepared-races.json reports/fit_b2_candidates_uncached.py research/factor-validation/fit_b2_candidates.py
      - name: Run uncached baseline fit
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
          BLIS_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          /usr/bin/time -f 'UNCACHED_FIT_ELAPSED_SECONDS=%e' -o reports/b2-uncached-fit-time.txt python reports/fit_b2_candidates_uncached.py reports/b2-prepared-races.json --out reports/b2-uncached-candidate-validation.json --history-manifest reports/b2-horse-pages-manifest.json --history-audit reports/b2-horse-pages-audit.json --race-reconciliation reports/b2-race-dataset-reconciliation.json 2>&1 | tee reports/b2-uncached-fit.log
          cat reports/b2-uncached-fit-time.txt
      - name: Run cached fit
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
          BLIS_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          /usr/bin/time -f 'CACHED_FIT_ELAPSED_SECONDS=%e' -o reports/b2-cached-fit-time.txt python research/factor-validation/fit_b2_candidates.py reports/b2-prepared-races.json --out reports/b2-cached-candidate-validation.json --history-manifest reports/b2-horse-pages-manifest.json --history-audit reports/b2-horse-pages-audit.json --race-reconciliation reports/b2-race-dataset-reconciliation.json 2>&1 | tee reports/b2-cached-fit.log
          cat reports/b2-cached-fit-time.txt
      - name: Compare same-run numerical outputs
        run: python scripts/compare_b2_benchmark_outputs.py reports/b2-uncached-candidate-validation.json reports/b2-cached-candidate-validation.json --tolerance 1e-8 --out reports/b2-cache-benchmark-comparison.json
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b2-real-data-cache-benchmark
          path: |
            reports/b2-uncached-fit-time.txt
            reports/b2-uncached-fit.log
            reports/b2-cached-fit-time.txt
            reports/b2-cached-fit.log
            reports/b2-cache-benchmark-comparison.json
            reports/b2-uncached-candidate-validation.sha256
            reports/b2-cached-candidate-validation.sha256
          if-no-files-found: warn
          retention-days: 14
